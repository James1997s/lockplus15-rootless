<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="style.css"></head><body><main id="theme-root"><div id="wallpaper" class="theme-element wallpaper" style="position:absolute;left:50%;top:0px;transform:translateX(-50%);z-index:-100;background:linear-gradient(145deg,#FFFFFF,#FFFFFF)"></div><div id="heading" class="theme-element" style="position:absolute;left:50%;top:75px;width:300px;height:18px;transform:translateX(-50%);color:#191919;font-family:HelveticaNeue-Medium;font-size:11px;font-weight:600;letter-spacing:2.0px;z-index:10">A MOMENT IN MOTION</div><div id="outerFrame" class="theme-element" style="position:absolute;left:50%;top:258px;width:324px;height:250px;transform:translateX(-50%);color:rgba(0,0,0,0);border-radius:2px;background-color:#181818;z-index:10;padding:0px"></div><div id="whiteMat" class="theme-element" style="position:absolute;left:50%;top:264px;width:312px;height:238px;transform:translateX(-50%);color:rgba(0,0,0,0);background-color:#FFFFFF;z-index:12;padding:0px"></div><img id="framedAnimation" class="theme-element" src="parking-animation.gif" style="position:absolute;left:50%;top:288px;width:284px;height:190px;transform:translateX(-50%);opacity:1.0;border-radius:0px;z-index:15"><div id="wordClock" class="theme-element dynamic word-clock" style="position:absolute;left:50%;top:105px;width:332px;height:92px;transform:translateX(-50%);color:#0D0D0D;font-family:AvenirNext-DemiBold;font-size:31px;font-weight:700;letter-spacing:1.1px;z-index:20"></div><div id="date" class="theme-element dynamic date" style="position:absolute;left:50%;top:210px;width:300px;height:20px;transform:translateX(-50%);color:#565656;font-family:HelveticaNeue-Medium;font-size:12px;font-weight:600;letter-spacing:1.0px;z-index:20"></div><div id="caption" class="theme-element" style="position:absolute;left:50%;top:518px;width:300px;height:18px;transform:translateX(-50%);color:#171717;font-family:HelveticaNeue-Bold;font-size:11px;font-weight:700;letter-spacing:2.0px;z-index:20">MOTION STUDY</div></main><script src="script.js"></script></body></html>
