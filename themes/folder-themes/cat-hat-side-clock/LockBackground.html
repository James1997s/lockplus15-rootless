<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="style.css"></head><body><main id="theme-root"><div id="wallpaper" class="theme-element wallpaper" style="position:absolute;left:50%;top:0px;transform:translateX(-50%);z-index:-100;background:linear-gradient(145deg,#08152D,#08152D)"></div><img id="catBackground" class="theme-element" src="cat-hat-animated-wallpaper.gif" style="position:absolute;left:50%;top:0px;width:375px;height:667px;transform:translateX(-50%);opacity:1.0;border-radius:0px;z-index:0"><div id="date" class="theme-element dynamic date" style="position:absolute;left:205px;top:44px;width:158px;height:26px;color:#F8E8C2;font-family:CookieCutout;font-size:16px;font-weight:400;text-shadow:0px 2px 3px rgba(0,0,0,0.65);z-index:10"></div><div id="caption" class="theme-element" style="position:absolute;left:224px;top:78px;width:140px;height:24px;color:#F8E8C2;font-family:CookieCutout;font-size:10px;font-weight:400;letter-spacing:1px;text-shadow:0px 2px 3px rgba(0,0,0,0.65);z-index:10"><span style="letter-spacing:1px">TIME IS A FUNNY THING</span></div><div id="accent" class="theme-element" style="position:absolute;left:50%;top:600px;width:140px;height:28px;transform:translateX(-50%) rotate(-8deg);color:#E84B4B;font-family:CookieCutout;font-size:12px;font-weight:400;letter-spacing:1px;text-shadow:1px 1px 0px #F8E8C2;z-index:10">OH, THE PLACES!</div><div id="clock" class="theme-element dynamic clock" style="position:absolute;left:50%;top:253px;width:126px;height:82px;transform:translateX(-50%) translateX(-145px) rotate(90deg);color:#F4D08B;font-family:CookieCutout;font-size:58px;font-weight:400;letter-spacing:1px;text-shadow:2px 2px 0px #B52D32, 3px 3px 5px rgba(0,0,0,0.6);z-index:12"></div></main><script src="script.js"></script></body></html>
