<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>
  <main class="lock-screen">
    <header class="topline">
      <span class="weekday" id="weekday">THU</span>
      <span class="date" id="date">AUG 27</span>
    </header>
    <section class="clock-wrap" aria-label="Time">
      <div class="clock" id="clock"><span>12</span><span>34</span></div>
    </section>
    <section class="bottom-row" aria-label="Lock screen controls">
      <div class="control">◒</div>
      <div class="control">◌</div>
    </section>
    <div class="swipe-bar"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
