<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Silent Film Chaplin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lockscreen">
    <img class="wallpaper" src="wallpaper.png" alt="">
    <div class="film-wash"></div>
    <div class="vignette"></div>
    <div class="dust dust-one"></div>
    <div class="dust dust-two"></div>

    <header class="masthead">
      <div class="rule"></div>
      <div class="kicker">THE EVENING EDITION · WALSALL</div>
      <h1>THE SILENT<br><span>HOUR</span></h1>
      <div class="subhead"><span>PICTURES</span><i></i><span>NEWS</span><i></i><span>WEATHER</span></div>
      <div class="rule"></div>
    </header>

    <section class="time-card" aria-label="Live time and date">
      <div class="edition">VOL. 01 · NO. 22</div>
      <div class="time" id="clock">22:05</div>
      <div class="date" id="date">THURSDAY · 27 AUGUST 2026</div>
      <div class="weather" id="weather">WALSALL · LIVE WEATHER</div>
    </section>

    <footer class="footer-line">
      <span>EXTRA!</span><strong>THE NIGHT WALKER</strong><span id="battery">BATTERY 37%</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
