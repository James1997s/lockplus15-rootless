<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Comic Wall Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lockscreen">
    <div class="comic-wall" aria-hidden="true">
      <div class="panel panel-one"><b>POW!</b><span>///</span></div>
      <div class="panel panel-two"><b>BOOM!</b><span>✦</span></div>
      <div class="panel panel-three"><b>WHOOSH!</b><span>↯</span></div>
      <div class="panel panel-four"><b>GRAFF!</b><span>★</span></div>
      <div class="panel panel-five"><b>SMASH!</b><span>///</span></div>
      <div class="halftone h-one"></div><div class="halftone h-two"></div><div class="halftone h-three"></div>
      <div class="spray-star star-one">★</div><div class="spray-star star-two">✦</div>
    </div>

    <section class="stacked-clock" aria-label="Live time">
      <div class="stack-digit single-time" id="stack-time-1">20:32</div>
      <div class="small-date" id="small-date">THU 27 AUG</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
